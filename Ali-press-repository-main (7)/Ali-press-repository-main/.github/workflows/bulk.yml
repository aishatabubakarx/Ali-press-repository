name: Bulk pins (CSV)

# Builds Pinterest "Bulk create Pins" CSV files (200 pins each) with every pin scheduled and tagged.
# Run it by hand: Actions > Bulk pins (CSV) > Run workflow. Nothing is posted by this workflow; you
# upload the CSV to Pinterest yourself (steps appear on the run page).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to make: test (a few pins, try the upload first), batches (200 pins each), single_day (one chosen day)"
        type: choice
        options: [test, batches, single_day]
        default: test
      batches:
        description: "batches mode: how many 200-pin batches (2 = 400 pins)"
        default: "2"
      pins_per_day:
        description: "batches mode: pins scheduled per day"
        default: "15"
      start_date:
        description: "batches/test mode: first posting day, YYYY-MM-DD (blank = tomorrow)"
        required: false
      day_date:
        description: "single_day mode: the day, YYYY-MM-DD"
        required: false
      day_pins:
        description: "single_day mode: how many pins that day (max 200)"
        default: "15"
      test_pins:
        description: "test mode: how many pins"
        default: "5"
      ai_scenes:
        description: "Turn products into AI lifestyle scenes (needs META_IMAGE_API_KEY secret)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: pins
  cancel-in-progress: false

jobs:
  bulk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build the bulk files
        env:
          AE_APP_KEY: ${{ secrets.AE_APP_KEY }}
          AE_APP_SECRET: ${{ secrets.AE_APP_SECRET }}
          AE_TRACKING_ID: ${{ secrets.AE_TRACKING_ID }}
          META_IMAGE_API_KEY: ${{ secrets.META_IMAGE_API_KEY }}
          MODE: ${{ inputs.mode }}
          BATCHES: ${{ inputs.batches }}
          PER_DAY: ${{ inputs.pins_per_day }}
          START_DATE: ${{ inputs.start_date }}
          DAY_DATE: ${{ inputs.day_date }}
          DAY_PINS: ${{ inputs.day_pins }}
          TEST_PINS: ${{ inputs.test_pins }}
          AI: ${{ inputs.ai_scenes }}
        run: |
          ARGS="--mode $MODE --batches ${BATCHES:-1} --per-day ${PER_DAY:-15} --day-pins ${DAY_PINS:-15} --test-pins ${TEST_PINS:-5}"
          [ -n "$START_DATE" ] && ARGS="$ARGS --start-date $START_DATE"
          [ -n "$DAY_DATE" ] && ARGS="$ARGS --day-date $DAY_DATE"
          [ "$AI" != "true" ] && ARGS="$ARGS --no-ai"
          python bulk.py $ARGS

      - name: Save the pin images and remember which products were used
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add posted.json docs/bulk bulk_out
          git diff --cached --quiet || (git commit -m "Bulk pins: images, CSV and used products" && git pull --rebase --autostash && git push)

      - name: Upload the CSV files
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-csv
          path: bulk_out/latest/
          retention-days: 30
          if-no-files-found: error
