name: Make pins

on:
  schedule:            # times are UTC; 3 small batches a day looks more natural than one big dump
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build images only, send nothing to Make)"
        type: boolean
        default: true
      limit:
        description: "Pins this run (blank = value in config.json)"
        required: false
        default: "2"

permissions:
  contents: write

concurrency:
  group: pins
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build pins
        env:
          AE_APP_KEY: ${{ secrets.AE_APP_KEY }}
          AE_APP_SECRET: ${{ secrets.AE_APP_SECRET }}
          AE_TRACKING_ID: ${{ secrets.AE_TRACKING_ID }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          DRY: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          LIMIT: ${{ inputs.limit || '' }}
        run: |
          ARGS=""
          if [ "$DRY" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          python pipeline.py $ARGS

      - name: Save preview images (to check the designs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pin-previews
          path: out/
          retention-days: 3
          if-no-files-found: ignore

      - name: Remember which products were posted
        run: |
          git config user.name "pin-bot"
          git config user.email "pin-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "Update posted products" && git push)
